name: Build Android APK

on:
  push:
    branches:
      - android-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy PWA into Android assets
        shell: bash
        run: |
          set -e
          mkdir -p android-clean/app/src/main/assets/www
          cp index.html android-clean/app/src/main/assets/www/
          cp manifest.json android-clean/app/src/main/assets/www/ || true
          cp sw.js android-clean/app/src/main/assets/www/ || true
          cp favicon.ico android-clean/app/src/main/assets/www/ || true
          cp -R assets android-clean/app/src/main/assets/www/
          cp -R icons android-clean/app/src/main/assets/www/ || true

      - name: Build debug APK
        working-directory: android-clean
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Debt-Freedom-Tracker-APK
          path: android-clean/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
